<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALAA SALON</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Playfair+Display:wght@600;800&display=swap">
<style>
:root{--a:#d9a38f;--bg:#1b1218;--tx:#f7e9e4;--r:22px}
*{box-sizing:border-box}.hide{display:none!important}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Cairo,Tahoma,sans-serif;background:var(--bg);padding:20px}
main{max-width:440px;margin:0 auto;padding:18px}
.card{border-radius:var(--r);background:#221721;border:1px solid #d9a38f40;padding:20px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:22px;font-weight:800}.mut{opacity:.7;font-size:14px}
input{width:100%;padding:13px;border-radius:14px;border:1px solid #d9a38f40;background:#0003;color:var(--tx);margin-top:10px;font-size:16px;text-align:center}
.btn{width:100%;margin-top:12px;border:0;border-radius:14px;padding:13px;font:800 16px Cairo;color:var(--bg);background:var(--a);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
.s{aspect-ratio:1;border-radius:50%;border:1.5px dashed #d9a38f55;display:grid;place-items:center}
.s.on{border-style:solid;background:var(--a);color:var(--bg);font-weight:bold}
</style>
</head>
<body>
<main>
 <div class="card" id="loginCard">
  <h2>ALAA SALON</h2>
  <p class="mut">أدخل اسمك أو رقم بطاقتك للدخول:</p>
  <input id="username" placeholder="اسم العميل">
  <button class="btn" id="loginBtn">دخول</button>
 </div>

 <div class="card hide" id="appCard">
  <h2 id="welcomeUser">أهلاً بك</h2>
  <p class="mut">أختام الولاء الخاصة بك:</p>
  <div class="grid" id="stampsGrid">
   <div class="s">1</div><div class="s">2</div><div class="s">3</div><div class="s">4</div><div class="s">5</div>
  </div>
  <button class="btn" id="logoutBtn" style="background:#444;color:#fff;margin-top:20px">خروج</button>
 </div>
</main>

<script>
const $ = id => document.getElementById(id);
$("loginBtn").onclick = () => {
  const name = $("username").value.trim();
  if(!name) return alert("اكتب الاسم من فضلك");
  localStorage.setItem("salon_user", name);
  loadApp(name);
};
$("logoutBtn").onclick = () => {
  localStorage.removeItem("salon_user");
  $("appCard").classList.add("hide");
  $("loginCard").classList.remove("hide");
};
function loadApp(name){
  $("loginCard").classList.add("hide");
  $("appCard").classList.remove("hide");
  $("welcomeUser").textContent = "أهلاً بك، " + name;
  let stamps = +(localStorage.getItem("stamps_" + name) || 0);
  const grid = $("stampsGrid").children;
  for(let i=0; i<grid.length; i++){
    if(i < stamps) grid[i].classList.add("on");
    else grid[i].classList.remove("on");
  }
}
const savedUser = localStorage.getItem("salon_user");
if(savedUser) loadApp(savedUser);
</script>
</body>
</html>
