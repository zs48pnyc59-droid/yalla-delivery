<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>siplab - Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#111;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:'Poppins',sans-serif}
  .frame{position:relative;height:100vh;aspect-ratio:9/16;overflow:hidden;
    background:radial-gradient(circle at 50% 40%,#a50f0f 0%,#8a0606 45%,#5c0000 100%)}

  /* زر الحفظ */
  #rec{position:fixed;bottom:20px;left:20px;z-index:99;background:#fff;color:#8a0606;border:none;
    border-radius:40px;padding:14px 26px;font-family:'Tajawal',sans-serif;font-size:18px;font-weight:700;
    cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.4)}
  #rec:hover{transform:scale(1.05)}
  #status{position:fixed;bottom:80px;left:20px;z-index:99;color:#fff;font-family:'Tajawal',sans-serif;font-size:16px}

  .bubble{position:absolute;border:2px solid rgba(255,255,255,.12);border-radius:50%;animation:float 9s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-40px)}}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3vh;opacity:0;transform:scale(1.1);transition:opacity .7s ease,transform .7s ease;color:#fff}
  .scene.active{opacity:1;transform:scale(1)}

  .cup{width:45%;opacity:0}
  .play .cup{animation:cupIn 1s ease forwards}
  @keyframes cupIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
  .steam{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:0;animation:steam 2s ease-in-out infinite}
  .steam:nth-child(2){animation-delay:.5s}.steam:nth-child(3){animation-delay:1s}
  @keyframes steam{0%{opacity:0;transform:translateY(12px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-22px)}}

  .logo{filter:brightness(0) invert(1)}
  .txt{filter:none;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center}
  .main{width:60%;opacity:0;position:relative;z-index:2}
  .main.txt{width:auto;font-size:7vh}
  .play .main{animation:spinIn 1.4s cubic-bezier(.2,1.4,.4,1) forwards,beat 1.2s ease-in-out 1.6s infinite}
  @keyframes spinIn{from{opacity:0;transform:scale(0) rotate(-360deg)}to{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  .ring{position:absolute;width:30vh;height:30vh;border:3px solid rgba(255,255,255,.5);border-radius:50%;opacity:0}
  .play .ring{animation:ripple 2s ease-out infinite;animation-delay:var(--d)}
  @keyframes ripple{0%{transform:scale(.3);opacity:.8}100%{transform:scale(2.2);opacity:0}}

  .center{width:40%;opacity:0}
  .center.txt{width:auto;font-size:5vh}
  .play .center{animation:pop 1s cubic-bezier(.2,1.5,.4,1) forwards,beat 1.2s ease-in-out 1s infinite}
  @keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
  .orbit{position:absolute;width:42vh;height:42vh;opacity:0}
  .play .orbit{animation:fadeIn .8s ease .4s forwards,rot 6s linear infinite}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes rot{to{transform:rotate(360deg)}}
  .mini{position:absolute;width:9vh;height:9vh;display:flex;align-items:center;justify-content:center}
  .mini img,.mini .txt{width:100%;animation:rot 6s linear infinite reverse}
  .mini .txt{font-size:1.8vh}
  .m1{top:0;left:calc(50% - 4.5vh)}.m2{bottom:0;left:calc(50% - 4.5vh)}
  .m3{left:0;top:calc(50% - 4.5vh)}.m4{right:0;top:calc(50% - 4.5vh)}

  .small{width:35%;opacity:0}
  .small.txt{width:auto;font-size:4.5vh}
  .play .small{animation:pop 1s cubic-bezier(.2,1.5,.4,1) forwards}
  .letters{font-weight:800;font-size:8vh;line-height:1.1;letter-spacing:.6vh;perspective:400px}
  .letters span{display:inline-block;opacity:0;transform:translateY(40px) rotateX(90deg)}
  .play .letters span{animation:letter .6s ease forwards;animation-delay:calc(var(--i) * .1s + .5s)}
  @keyframes letter{to{opacity:1;transform:translateY(0) rotateX(0)}}
  .line{height:4px;width:0;background:#fff;border-radius:4px}
  .play .line{animation:grow 1s ease 1.8s forwards}
  @keyframes grow{to{width:50%}}
</style>
</head>
<body>
<button id="rec">⏺ حفظ الفيديو</button>
<div id="status"></div>

<div class="frame">
  <div class="bubble" style="width:18vh;height:18vh;top:6%;left:-6%"></div>
  <div class="bubble" style="width:10vh;height:10vh;top:20%;right:8%;animation-delay:2s"></div>
  <div class="bubble" style="width:24vh;height:24vh;bottom:-6%;right:-10%;animation-delay:4s"></div>
  <div class="bubble" style="width:8vh;height:8vh;bottom:22%;left:10%;animation-delay:1s"></div>

  <div class="scene">
    <svg class="cup" viewBox="0 -10 200 230">
      <g>
        <path class="steam" d="M75 65 q-12 -18 0 -36 q12 -18 0 -36"/>
        <path class="steam" d="M100 65 q-12 -18 0 -36 q12 -18 0 -36"/>
        <path class="steam" d="M125 65 q-12 -18 0 -36 q12 -18 0 -36"/>
      </g>
      <rect x="38" y="78" width="124" height="16" rx="6" fill="#fff"/>
      <path d="M45 94 h110 l-12 110 h-86 z" fill="#f5efe6"/>
      <circle cx="100" cy="148" r="20" fill="none" stroke="#8a0606" stroke-width="5"/>
    </svg>
  </div>

  <div class="scene">
    <div class="ring" style="--d:0s"></div>
    <div class="ring" style="--d:.7s"></div>
    <div class="ring" style="--d:1.4s"></div>
    <img class="logo main" src="logo.png" alt="">
  </div>

  <div class="scene">
    <div class="orbit">
      <div class="mini m1"><img class="logo" src="logo.png" alt=""></div>
      <div class="mini m2"><img class="logo" src="logo.png" alt=""></div>
      <div class="mini m3"><img class="logo" src="logo.png" alt=""></div>
      <div class="mini m4"><img class="logo" src="logo.png" alt=""></div>
    </div>
    <img class="logo center" src="logo.png" alt="">
  </div>

  <div class="scene">
    <img class="logo small" src="logo.png" alt="">
    <div class="letters" data-text="COMING"></div>
    <div class="letters" data-text="SOON"></div>
    <div class="line"></div>
  </div>
</div>

<script>
  // تقسيم COMING SOON إلى حروف
  let idx=0;
  document.querySelectorAll('.letters').forEach(el=>{
    [...el.dataset.text].forEach(ch=>{
      const s=document.createElement('span');
      s.textContent=ch; s.style.setProperty('--i',idx++);
      el.appendChild(s);
    });
  });

  // بديل نصي إذا لم توجد صورة اللوغو
  const test=new Image();
  test.onerror=()=>document.querySelectorAll('img.logo').forEach(im=>{
    const d=document.createElement('div');
    d.className=im.className+' txt'; d.textContent='siplab';
    im.replaceWith(d);
  });
  test.src='logo.png';

  // تشغيل المشاهد
  const scenes=[...document.querySelectorAll('.scene')];
  const times=[3000,3500,4000,5000];
  let i=0, timer;
  function play(){
    scenes.forEach(s=>s.classList.remove('active'));
    const s=scenes[i];
    s.classList.remove('play'); void s.offsetWidth;
    s.classList.add('play','active');
    timer=setTimeout(()=>{ i=(i+1)%scenes.length; play(); }, times[i]);
  }
  function restart(){ clearTimeout(timer); i=0; play(); }
  play();

  // ===== تسجيل الفيديو وحفظه =====
  const btn=document.getElementById('rec');
  const status=document.getElementById('status');
  btn.onclick=async()=>{
    try{
      const stream=await navigator.mediaDevices.getDisplayMedia({
        video:{frameRate:30}, audio:false, preferCurrentTab:true
      });
      const track=stream.getVideoTracks()[0];

      // قص التسجيل على إطار الإعلان فقط (Chrome / Edge)
      if(window.CropTarget && track.cropTo){
        await track.cropTo(await CropTarget.fromElement(document.querySelector('.frame')));
      }

      btn.style.display='none';
      status.textContent='⏳ جاري التسجيل...';

      const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
      const type=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
      const rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:8000000});
      const chunks=[];
      rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      rec.onstop=()=>{
        stream.getTracks().forEach(t=>t.stop());
        const ext=type.includes('mp4')?'mp4':'webm';
        const a=document.createElement('a');
        a.href=URL.createObjectURL(new Blob(chunks,{type:type||'video/webm'}));
        a.download='siplab-coming-soon.'+ext;
        a.click();
        status.textContent='✅ تم حفظ الفيديو ('+ext.toUpperCase()+')';
        btn.style.display='';
      };

      await new Promise(r=>setTimeout(r,600));
      restart();
      rec.start();
      setTimeout(()=>rec.stop(), times.reduce((a,b)=>a+b,0)-200);
    }catch(e){
      status.textContent='';
      btn.style.display='';
      alert('لم يتم التسجيل، تأكد من اختيار "علامة التبويب هذه" والضغط على مشاركة.');
    }
  };
</script>
</body>
</html>
