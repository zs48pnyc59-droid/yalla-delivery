<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b1030">
<title>روابطي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;min-height:100dvh;overflow-x:hidden;
  font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text);
  transition:color .5s ease;
  background:#070a18;
}
:root{
  --text:#fff;
  --text-soft:rgba(255,255,255,.72);
  --glass:rgba(255,255,255,.10);
  --glass-brd:rgba(255,255,255,.20);
  --radius:28px;
  --btn-radius:18px;
  --shadow:0 26px 70px -26px rgba(0,0,0,.7);
  --blur:22px;
  --c1:#7c5cff; --c2:#00d4ff; --c3:#ff4d94;
  --accent:#7c5cff;
}
body.light{
  --text:#0f1326;
  --text-soft:rgba(15,19,38,.62);
  --glass:rgba(255,255,255,.55);
  --glass-brd:rgba(255,255,255,.9);
  --shadow:0 26px 70px -26px rgba(30,40,90,.28);
}
#bg{position:fixed;inset:0;z-index:-3;transition:background .7s ease;background:#0b1030}
#bg::after{content:'';position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .6s ease}
body.light #bg::after{opacity:.78}
.blobs{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:48vmax;height:48vmax;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
.blob.b1{background:var(--c1);top:-18vmax;right:-14vmax;animation:float1 22s ease-in-out infinite}
.blob.b2{background:var(--c2);bottom:-20vmax;left:-16vmax;animation:float2 26s ease-in-out infinite}
.blob.b3{background:var(--c3);top:35%;left:30%;width:34vmax;height:34vmax;opacity:.4;animation:float3 30s ease-in-out infinite}
body.light .blob{opacity:.38}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-6vmax,7vmax) scale(1.15)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(7vmax,-5vmax) scale(1.12)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-5vmax,-6vmax) scale(1.2)}}
#loader{
  position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%, rgba(124,92,255,.20), transparent 60%), #070a18;
  transition:opacity .7s ease, visibility .7s ease;
}
#loader.hide{opacity:0;visibility:hidden}
.loader-inner{display:flex;flex-direction:column;align-items:center;gap:26px}
.loader-logo{
  width:112px;height:112px;border-radius:30px;object-fit:contain;
  animation:pop 1.8s ease-in-out infinite;
  filter:drop-shadow(0 14px 40px rgba(124,92,255,.55));
}
.loader-fallback{
  width:112px;height:112px;border-radius:30px;display:grid;place-items:center;
  font-size:44px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#7c5cff,#00d4ff);
  box-shadow:0 14px 40px rgba(124,92,255,.5);
  animation:pop 1.8s ease-in-out infinite;
}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#7c5cff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#app{
  position:relative;z-index:1;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
}
.card{
  width:min(100%,460px);
  padding:30px 20px 22px;
  background:var(--glass);
  border:1px solid var(--glass-brd);
  border-radius:var(--radius);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);
  backdrop-filter:blur(var(--blur)) saturate(170%);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.22);
  animation:cardIn .8s cubic-bezier(.2,.9,.25,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.top-logo{
  width:96px;height:96px;border-radius:26px;object-fit:cover;display:block;margin:0 auto 16px;
  border:1px solid var(--glass-brd);
  box-shadow:0 12px 34px -10px rgba(0,0,0,.5);
  background:rgba(255,255,255,.08);
}
.top-logo-fallback{
  width:96px;height:96px;border-radius:26px;display:grid;place-items:center;margin:0 auto 16px;
  font-size:38px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:0 12px 34px -10px rgba(0,0,0,.5);
}
h1.title{
  margin:0 0 6px;text-align:center;font-size:23px;font-weight:800;letter-spacing:-.3px;
  color:var(--text);
}
p.subtitle{margin:0 0 22px;text-align:center;font-size:14.5px;color:var(--text-soft);font-weight:400}
#accounts{display:flex;flex-direction:column;gap:12px}
#accounts.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.account{
  display:flex;align-items:center;gap:13px;
  padding:13px 15px;
  background:var(--glass);
  border:1px solid var(--glass-brd);
  border-radius:var(--btn-radius);
  color:var(--text);text-decoration:none;
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 8px 24px -14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.16);
  transition:transform .3s cubic-bezier(.2,.9,.25,1), background .3s, box-shadow .3s, border-color .3s;
  opacity:0;animation:itemIn .6s cubic-bezier(.2,.9,.25,1) forwards;
  will-change:transform;
  min-height:60px;
}
@keyframes itemIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.account:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 16px 34px -16px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.25);border-color:rgba(255,255,255,.35)}
.account:active{transform:scale(.975)}
.ico{
  flex:0 0 auto;width:38px;height:38px;border-radius:calc(var(--btn-radius) * .7);
  display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  color:#fff;font-weight:800;font-size:15px;
}
body.light .ico{box-shadow:0 4px 14px -4px rgba(80,60,200,.5)}
.ico img{width:100%;height:100%;object-fit:cover}
.ico svg{width:60%;height:60%;display:block}
.txt{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{opacity:.45;font-size:15px;transition:transform .3s,opacity .3s}
.account:hover .arrow{opacity:.9;transform:translate(-2px,-2px)}
#accounts.grid .account{flex-direction:column;text-align:center;gap:8px;padding:16px 10px}
#accounts.grid .txt{font-size:13px;width:100%}
#accounts.grid .arrow{display:none}
.fab{
  position:fixed;z-index:20;
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--glass);border:1px solid var(--glass-brd);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  color:var(--text);cursor:pointer;font-size:18px;
  box-shadow:0 10px 26px -12px rgba(0,0,0,.6);
  transition:transform .25s, background .25s;
}
.fab:active{transform:scale(.9)}
.fab:hover{background:rgba(255,255,255,.2)}
#themeBtn{top:calc(env(safe-area-inset-top,0px) + 16px);left:16px}
#shareBtn{top:calc(env(safe-area-inset-top,0px) + 16px);right:16px}
#statusScreen{position:fixed;inset:0;z-index:500;display:none;place-items:center;padding:24px}
#statusScreen.show{display:grid}
.status-card{
  width:min(100%,420px);text-align:center;padding:40px 26px;
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);
  box-shadow:var(--shadow);animation:cardIn .7s cubic-bezier(.2,.9,.25,1) both;
}
.status-emoji{font-size:56px;display:block;margin-bottom:16px;animation:pop 2.4s ease-in-out infinite}
.status-card h2{margin:0 0 10px;font-size:21px;font-weight:800;color:var(--text)}
.status-card p{margin:0 0 22px;color:var(--text-soft);font-size:14.5px;line-height:1.8}
.status-btn{
  display:inline-block;padding:11px 26px;border-radius:999px;border:1px solid var(--glass-brd);
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-weight:700;font-size:14px;
  text-decoration:none;cursor:pointer;font-family:inherit;transition:transform .25s;
}
.status-btn:active{transform:scale(.95)}
#toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);
  background:rgba(20,22,40,.9);color:#fff;padding:12px 22px;border-radius:999px;
  font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.4s cubic-bezier(.2,.9,.25,1);
  z-index:9999;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:420px){
  .card{padding:24px 15px 18px}
  h1.title{font-size:20px}
  .top-logo,.top-logo-fallback{width:84px;height:84px}
  #accounts.grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="bg"></div>
<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div id="loader">
  <div class="loader-inner">
    <div id="loaderLogoBox"></div>
    <div class="spinner"></div>
  </div>
</div>
<main id="app">
  <div class="card">
    <div id="topLogoBox"></div>
    <h1 class="title" id="siteTitle">اسمك هنا</h1>

    <div id="accounts"></div>

<div id="statusScreen">

</div>
<button class="fab" id="themeBtn" title="تبديل الثيم" aria-label="تبديل الثيم">🌙</button>
<button class="fab" id="shareBtn" title="مشاركة الموقع" aria-label="مشاركة">🔗</button>
<div id="toast"></div>

const $ = s => document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return esc(s)}
function loadSettings(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return {...DEFAULT, accounts: DEFAULT.accounts.map(a=>({...a}))};
    const p = JSON.parse(raw);
    return {...DEFAULT, ...p, accounts: Array.isArray(p.accounts)? p.accounts : DEFAULT.accounts.map(a=>({...a}))};
  }catch(e){ return {...DEFAULT, accounts: DEFAULT.accounts.map(a=>({...a}))}; }
}
function iconHTML(key, name){
  if(!key) return esc((name||'?').trim().charAt(0) || '?');
  if(/^(https?:|data:)/i.test(key)) return `<img src="${escAttr(key)}" alt="">`;
  if(ICONS[key]) return ICONS[key];
  return esc(String(key).slice(0,2));
}
const s = loadSettings();
let themeOverride = localStorage.getItem('linkhub_theme_override');
function applyAll(){
  const root = document.documentElement;
  root.style.setProperty('--c1', s.color1);
  root.style.setProperty('--c2', s.color2);
  root.style.setProperty('--c3', s.color3);
  const theme = themeOverride || s.theme || 'dark';
  document.body.classList.toggle('light', theme === 'light');
  $('#themeBtn').textContent = theme === 'light' ? '☀️' : '🌙';
  const bg = $('#bg');
  if(s.bgType === 'image' && s.bgImage){
    bg.style.backgroundImage = `url("${s.bgImage}")`;
    bg.style.backgroundSize = 'cover';
    bg.style.backgroundPosition = 'center';
    bg.style.backgroundRepeat = 'no-repeat';
  }else{
    bg.style.backgroundImage = 'none';
    bg.style.background = `radial-gradient(circle at 20% 10%, ${s.bg1}, transparent 55%), radial-gradient(circle at 85% 90%, ${s.bg3}, transparent 55%), linear-gradient(160deg, ${s.bg1}, ${s.bg2})`;
  }
  const shapes = {pill:'999px', soft:'18px', square:'6px', glass:'26px'};
  root.style.setProperty('--btn-radius', shapes[s.btnShape] || '18px');
  $('#topLogoBox').innerHTML = s.topLogo
    ? `<img class="top-logo" src="${escAttr(s.topLogo)}" alt="logo">`
    : `<div class="top-logo-fallback">${esc((s.siteTitle||'?').trim().charAt(0))}</div>`;
  $('#siteTitle').textContent = s.siteTitle || '';
  $('#siteSubtitle').textContent = s.siteSubtitle || '';
  document.title = s.siteTitle || 'روابطي';
  const accEl = $('#accounts');
  accEl.className = s.layout === 'grid' ? 'grid' : '';
  accEl.innerHTML = (s.accounts||[]).map((a,i)=>`
    <a class="account" href="${escAttr(a.url||'#')}" target="_blank" rel="noopener noreferrer"
       style="animation-delay:${Math.min(i*70,700)}ms">
      <span class="ico">${iconHTML(a.icon, a.name)}</span>
      <span class="txt">${esc(a.name||'رابط')}</span>
      <span class="arrow">↗</span>
    </a>`).join('');
  $('#themeBtn').style.display = s.showThemeToggle === false ? 'none' : 'grid';
  $('#shareBtn').style.display = s.showShare === false ? 'none' : 'grid';
  applyStatus();
}
function applyStatus(){
  const map = {
    maintenance:{emoji:'🔧', title:'الموقع قيد الصيانة', desc:'نعمل حالياً على تحسين الموقع، الرجاء العودة لاحقاً.'},
    closed:{emoji:'🌙', title:'مغلق اليوم', desc:'نأخذ استراحة اليوم، نراك غداً بإذن الله.'},
    updating:{emoji:'⚙️', title:'البرنامج قيد التحديث', desc:'نقوم بترقية النظام حالياً، تابعنا قريباً.'}
  };
  const st = s.status || 'open';
  if(st !== 'open' && map[st]){
    $('#statusEmoji').textContent = map[st].emoji;
    $('#statusTitle').textContent = map[st].title;
    $('#statusDesc').textContent = map[st].desc;
    $('#statusScreen').classList.add('show');
  }else{
    $('#statusScreen').classList.remove('show');
  }
}
function renderLoaderLogo(){
  $('#loaderLogoBox').innerHTML = s.loadingLogo
    ? `<img class="loader-logo" src="${escAttr(s.loadingLogo)}" alt="loading">`
    : `<div class="loader-fallback">${esc((s.siteTitle||'?').trim().charAt(0))}</div>`;
}
function hideLoader(){ $('#loader').classList.add('hide'); }
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
$('#themeBtn').addEventListener('click', ()=>{
  const cur = themeOverride || s.theme || 'dark';
  const next = cur === 'light' ? 'dark' : 'light';
  themeOverride = next;
  localStorage.setItem('linkhub_theme_override', next);
  applyAll();
});
$('#shareBtn').addEventListener('click', async ()=>{
  const data = {title: s.siteTitle, text: s.siteSubtitle, url: location.href};
  try{
    if(navigator.share){ await navigator.share(data); }
    else if(navigator.clipboard){ await navigator.clipboard.writeText(location.href); toast('تم نسخ الرابط'); }
  }catch(e){}
});
renderLoaderLogo();
applyAll();
const t0 = Date.now();
const start = ()=>{
  const wait = Math.max(0, 1700 - (Date.now()-t0));
  setTimeout(hideLoader, wait);
};
if(document.readyState === 'complete') start();
else window.addEventListener('load', start);
setTimeout(hideLoader, 4000);
window.addEventListener('storage', e=>{
  if(e.key === KEY || e.key === 'linkhub_theme_override') location.reload();
});
</script>
</body>
</html>
