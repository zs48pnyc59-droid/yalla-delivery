<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yalla Delivery | يلا ديلفري</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.9)),
                        url('https://images.unsplash.com/photo-1526367790999-0150786686a2?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 35px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo-container {
            margin-bottom: 15px;
        }

        .logo-icon {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.4);
            animation: pulse 2s infinite;
        }

        .logo-icon svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 900;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .brand-en {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: #ff4757;
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .cta-header {
            background: #f8fafc;
            border-right: 4px solid #ff4757;
            padding: 12px;
            font-size: 18px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 25px;
            border-radius: 6px;
            text-align: right;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background: #ffffff;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #ff4757;
            box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff4757, #e84118);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 18px rgba(255, 71, 87, 0.35);
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(255, 71, 87, 0.45);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 15px;
            font-weight: 700;
            font-size: 15px;
            display: none;
            padding: 12px;
            border-radius: 8px;
        }

        .status-msg.success {
            display: block;
            background: #dcfce7;
            color: #15803d;
        }

        .status-msg.error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo -->
        <div class="logo-container">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M19 7h-3V6a3 3 0 0 0-3-3H5a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h.78A3 3 0 0 0 11 18a3 3 0 0 0 5.22 0H18a3 3 0 0 0 3-3V10a3 3 0 0 0-2-3zM8 19.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5.5-13.5a1.5 1.5 0 0 1 1.5-1.5h1.78a1.5 1.5 0 0 1 1.42 1.02L18.8 8H13.5V6zm3.5 13.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
                </svg>
            </div>
        </div>

        <!-- Branding -->
        <h1 class="brand-name">يلا ديلفري</h1>
        <div class="brand-en">Yalla Delivery</div>

        <div class="cta-header">
            🛵 قدم طلبك الآن
        </div>

        <!-- Form -->
        <form id="deliveryForm">
            <div class="form-group">
                <label for="name">الاسم الكامل</label>
                <input type="text" id="name" placeholder="أدخل اسمك الكريم" required>
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف</label>
                <input type="tel" id="phone" placeholder="05XXXXXXXX" required dir="ltr" style="text-align: right;">
            </div>

            <div class="form-group">
                <label for="address">العنوان التفصيلي</label>
                <input type="text" id="address" placeholder="المدينة، الشارع، علامة مميزة" required>
            </div>

            <div class="form-group">
                <label for="orderDetails">تفاصيل الطلب</label>
                <textarea id="orderDetails" placeholder="اكتب أغراضك أو طلبك هنا بالتفصيل..." required></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">إرسال الطلب الآن</button>
            <div id="statusMsg" class="status-msg"></div>
        </form>
    </div>

    <script>
        // Webhook الخاص بقناة الديسكورد الخاصة بك
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1556726586407919630/5VrORfaR4NdN4kIInRwKLpD0wkhNwe-uAXjfQ_igAojxucCjtoyRs14RYM23VxctVhsL";

        const form = document.getElementById('deliveryForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const orderDetails = document.getElementById('orderDetails').value.trim();

            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري إرسال الطلب...';
            statusMsg.style.display = 'none';

            // تنسيق الرسالة لتظهر بكرت ملون وأنيق داخل روم الديسكورد
            const payload = {
                username: "يلا ديلفري - Yalla Delivery",
                avatar_url: "https://cdn-icons-png.flaticon.com/512/2972/2972531.png",
                embeds: [
                    {
                        title: "📦 طلب توصيل جديد!",
                        color: 16730225,
                        fields: [
                            { name: "👤 الاسم", value: name, inline: true },
                            { name: "📞 الهاتف", value: phone, inline: true },
                            { name: "📍 العنوان", value: address, inline: false },
                            { name: "📝 تفاصيل الطلب", value: orderDetails, inline: false }
                        ],
                        timestamp: new Date().toISOString(),
                        footer: { text: "نظام طلبات يلا ديلفري" }
                    }
                ]
            };

            try {
                const response = await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok || response.status === 204) {
                    statusMsg.className = 'status-msg success';
                    statusMsg.innerText = '✅ تم إرسال طلبك بنجاح! سنتواصل معك قريبًا.';
                    form.reset();
                } else {
                    throw new Error('فشل الإرسال');
                }
            } catch (error) {
                statusMsg.className = 'status-msg error';
                statusMsg.innerText = '❌ حدث خطأ أثناء إرسال الطلب. يرجى المحاولة مرة أخرى.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'إرسال الطلب الآن';
            }
        });
    </script>
</body>
</html>
