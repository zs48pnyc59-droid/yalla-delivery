<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول عبر OTP</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        #otp-section { display: none; }
        .message { margin-top: 15px; font-size: 14px; }
        .error { color: red; }
        .success { color: green; }
        #timer { font-weight: bold; color: #d9534f; }
    </style>
</head>
<body>

<div class="container">
    <h2>تسجيل الدخول</h2>
    
    <!-- قسم إدخال البريد الإلكتروني -->
    <div id="email-section">
        <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="example@domain.com" required>
        </div>
        <button id="send-otp-btn" onclick="sendOTP()">إرسال رمز التحقق</button>
    </div>

    <!-- قسم إدخال رمز OTP -->
    <div id="otp-section">
        <p>تم إرسال رمز التحقق إلى بريدك الإلكتروني.</p>
        <div class="form-group">
            <label for="otp">رمز التحقق (OTP)</label>
            <input type="text" id="otp" placeholder="أدخل الرمز المكون من 6 أرقام" maxlength="6">
        </div>
        <button id="verify-otp-btn" onclick="verifyOTP()">تحقق وتسجيل الدخول</button>
        <p class="message">لم يصلك الرمز؟ <span id="timer">00:60</span> <a href="#" onclick="sendOTP(); return false;" id="resend-link" style="display:none;">إعادة الإرسال</a></p>
    </div>

    <div id="message" class="message"></div>
</div>

<!-- استيراد مكتبة EmailJS -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
    // ====== الإعدادات الخاصة بك (جاهزة تماماً) ======
    const SERVICE_ID = "service_ovrwpb";       
    const TEMPLATE_ID = "template_1z68ok9"; 
    const PUBLIC_KEY = "7aCP5JzlMX9v6fodb";    
    // ==============================================

    // تهيئة EmailJS
    emailjs.init(PUBLIC_KEY);

    let generatedOTP = ""; 
    let timerInterval;     

    // دالة إرسال الرمز
    function sendOTP() {
        const emailInput = document.getElementById('email').value.trim();
        
        if (!emailInput || !validateEmail(emailInput)) {
            showMessage('يرجى إدخال بريد إلكتروني صحيح.', 'error');
            return;
        }

        // توليد رمز OTP عشوائي مكون من 6 أرقام
        generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
        console.log("رمز التحقق (للتجربة):", generatedOTP); // يظهر في الـ Console

        const sendBtn = document.getElementById('send-otp-btn');
        sendBtn.disabled = true;
        sendBtn.textContent = 'جاري الإرسال...';
        showMessage('', '');

        // إرسال البريد الإلكتروني باستخدام EmailJS
        emailjs.send(SERVICE_ID, TEMPLATE_ID, {
            user_email: emailInput,
            otp_code: generatedOTP
        }).then(function(response) {
            console.log('SUCCESS!', response.status, response.text);
            showMessage('تم إرسال رمز التحقق بنجاح. تحقق من بريدك.', 'success');
            
            document.getElementById('email-section').style.display = 'none';
            document.getElementById('otp-section').style.display = 'block';
            
            startTimer(60); 
        }, function(error) {
            console.log('FAILED...', error);
            showMessage('فشل إرسال الرمز. تأكد من الإعدادات أو حاول لاحقاً.', 'error');
            sendBtn.disabled = false;
            sendBtn.textContent = 'إرسال رمز التحقق';
        });
    }

    // دالة التحقق من الرمز
    function verifyOTP() {
        const enteredOTP = document.getElementById('otp').value.trim();

        if (!enteredOTP) {
            showMessage('يرجى إدخال رمز التحقق.', 'error');
            return;
        }

        if (enteredOTP === generatedOTP) {
            showMessage('تم تسجيل الدخول بنجاح!', 'success');
            document.getElementById('otp-section').innerHTML = '<h3>مرحباً بك!</h3><p>لقد تم التحقق من هويتك بنجاح.</p>';
        } else {
            showMessage('رمز التحقق غير صحيح. يرجى المحاولة مرة أخرى.', 'error');
            document.getElementById('otp').value = ''; 
        }
    }

    // دالة التحقق من صيغة الإيميل
    function validateEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }

    // دالة عرض الرسائل
    function showMessage(msg, type) {
        const messageEl = document.getElementById('message');
        messageEl.textContent = msg;
        messageEl.className = 'message ' + type;
    }

    // دالة المؤقت لإعادة الإرسال
    function startTimer(seconds) {
        const timerEl = document.getElementById('timer');
        const resendLink = document.getElementById('resend-link');
        resendLink.style.display = 'none';
        
        let timeLeft = seconds;
        timerEl.textContent = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerEl.textContent = '00:00';
                resendLink.style.display = 'inline';
                document.getElementById('send-otp-btn').disabled = false; 
            } else {
                timerEl.textContent = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
            }
        }, 1000);
    }
</script>
</body>
</html>
