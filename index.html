<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>siplab - Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#111;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:'Poppins',sans-serif}
  .frame{position:relative;height:100vh;aspect-ratio:9/16;overflow:hidden;
    background:radial-gradient(circle at 50% 40%,#a50f0f 0%,#8a0606 45%,#5c0000 100%)}
  .stage{position:absolute;inset:0}

  #rec{position:fixed;bottom:20px;left:20px;z-index:99;background:#fff;color:#8a0606;border:none;border-radius:40px;
    padding:14px 26px;font-family:'Tajawal',sans-serif;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.4)}
  #status{position:fixed;bottom:80px;left:20px;z-index:99;color:#fff;font-family:'Tajawal',sans-serif;font-size:16px}

  .bubble{position:absolute;border:2px solid rgba(255,255,255,.12);border-radius:50%;animation:float 9s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-40px)}}
  .ground{position:absolute;top:80vh;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent)}

  .winds{position:absolute;inset:0}
  .play .winds{animation:off .3s 4s forwards}
  .w{position:absolute;height:2px;width:12vh;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55));animation:wind 1.1s linear infinite}
  @keyframes wind{from{transform:translateX(70vh)}to{transform:translateX(-80vh)}}
  @keyframes off{to{opacity:0}}

  /* كوب siplab الطائر */
  .cupwrap{position:absolute;left:50%;top:33vh;width:32%;opacity:0;z-index:2;filter:drop-shadow(0 1.5vh 2vh rgba(0,0,0,.35))}
  .cupwrap svg{display:block;width:100%}
  .cuplogo{position:absolute;top:36%;left:50%;width:58%;transform:translateX(-50%) rotate(-4deg);
    filter:brightness(0) saturate(100%) invert(8%) sepia(89%) saturate(6000%) hue-rotate(358deg) brightness(88%) contrast(115%)}
  .cuplogo.txt2{filter:none;color:#8a0606;font-weight:800;font-size:3vh;text-align:center;width:auto}
  .play .cupwrap{opacity:1;animation:fly 4s ease-in-out both, drop .45s cubic-bezier(.55,0,1,.45) 4s forwards, hide .05s 4.45s forwards}
  @keyframes fly{
    0%{transform:translate(-50%,-60vh) rotate(-25deg)}
    20%{transform:translate(-50%,0) rotate(12deg)}
    40%{transform:translate(-65%,-4vh) rotate(-10deg)}
    60%{transform:translate(-35%,2vh) rotate(10deg)}
    80%{transform:translate(-50%,-6vh) rotate(-6deg)}
    100%{transform:translate(-50%,-10vh) rotate(0)}}
  @keyframes drop{from{transform:translate(-50%,-10vh) rotate(0)}to{transform:translate(-50%,23vh) rotate(20deg)}}
  @keyframes hide{to{opacity:0}}

  .shadow{position:absolute;left:50%;top:79vh;width:14vh;height:2.5vh;margin-left:-7vh;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(4px);opacity:0}
  .play .shadow{animation:shFly 4s ease-in-out both, shDrop .45s ease-in 4s forwards, hide .05s 4.45s forwards}
  @keyframes shFly{0%{transform:scale(.2);opacity:0}20%,100%{transform:scale(.45);opacity:.35}60%{transform:scale(.55);opacity:.4}}
  @keyframes shDrop{to{transform:scale(1.3);opacity:.7}}

  .play .stage{animation:shake .5s 4.45s}
  @keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(-14px,9px)}30%{transform:translate(12px,-11px)}
    45%{transform:translate(-9px,7px)}60%{transform:translate(7px,-5px)}80%{transform:translate(-3px,2px)}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
  .play .flash{animation:flash .4s 4.45s}
  @keyframes flash{from{opacity:.85}to{opacity:0}}

  .impact{position:absolute;left:50%;top:80vh;width:0;height:0}
  .play .impact{animation:dim 1s 6s forwards}
  @keyframes dim{to{opacity:.35}}
  .wave{position:absolute;width:20vh;height:5vh;margin:-2.5vh 0 0 -10vh;border:3px solid #fff;border-radius:50%;opacity:0}
  .play .wave{animation:wave .8s ease-out 4.45s}
  .play .wave.w2{animation-delay:4.6s}
  @keyframes wave{from{transform:scale(.2);opacity:1}to{transform:scale(3);opacity:0}}
  .puddle{position:absolute;width:22vh;height:3.5vh;margin:-1.75vh 0 0 -11vh;border-radius:50%;background:#6b3e26;transform:scale(0)}
  .play .puddle{animation:puddle .4s ease-out 4.45s forwards}
  @keyframes puddle{to{transform:scale(1)}}
  .cracks{position:absolute;width:40vh;height:10vh;margin:-2vh 0 0 -20vh}
  .cracks path{fill:none;stroke:rgba(255,255,255,.6);stroke-width:2.5;stroke-dasharray:100;stroke-dashoffset:100}
  .play .cracks path{animation:draw .5s ease-out 4.5s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .drop{position:absolute;border-radius:50%;opacity:0}
  .play .drop{animation:splash 1s cubic-bezier(.2,.7,.4,1) 4.45s}
  @keyframes splash{
    0%{transform:translate(0,0) scale(1);opacity:1}
    50%{transform:translate(var(--x),var(--y)) scale(1);opacity:1}
    100%{transform:translate(calc(var(--x)*1.3),calc(var(--y) + 18vh)) scale(.4);opacity:0}}

  .logo{filter:brightness(0) invert(1)}
  .txt{filter:none;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
  .hero{position:absolute;top:20vh;left:50%;width:55%;margin-left:-27.5%;opacity:0;z-index:3}
  .hero.txt{width:auto;left:0;right:0;margin:0;font-size:8vh}
  .play .hero{animation:rise 1.1s cubic-bezier(.2,1.4,.4,1) 4.9s both, beat 1.4s ease-in-out 6.2s infinite}
  @keyframes rise{from{opacity:0;transform:translateY(55vh) scale(0) rotate(-200deg)}to{opacity:1;transform:none}}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .halo{position:absolute;top:32vh;left:50%;width:30vh;height:30vh;margin:-15vh 0 0 -15vh;border:3px solid rgba(255,255,255,.45);border-radius:50%;opacity:0}
  .play .halo{animation:ripple 2s ease-out infinite;animation-delay:var(--d)}
  @keyframes ripple{0%{transform:scale(.3);opacity:.8}100%{transform:scale(2.2);opacity:0}}

  .cs{position:absolute;top:56vh;left:0;right:0;text-align:center;color:#fff;z-index:3}
  .letters{font-weight:800;font-size:8vh;line-height:1.1;letter-spacing:.6vh;perspective:400px}
  .letters span{display:inline-block;opacity:0;transform:translateY(40px) rotateX(90deg)}
  .play .letters span{animation:letter .6s ease forwards;animation-delay:calc(var(--i) * .1s + 6.2s)}
  @keyframes letter{to{opacity:1;transform:none}}
  .line{height:4px;width:0;background:#fff;border-radius:4px;margin:2vh auto 0}
  .play .line{animation:grow 1s ease 7.4s forwards}
  @keyframes grow{to{width:50%}}
</style>
</head>
<body>
<button id="rec">⏺ حفظ الفيديو</button>
<div id="status"></div>

<div class="frame" id="frame">
  <div class="stage">
    <div class="bubble" style="width:18vh;height:18vh;top:6%;left:-6%"></div>
    <div class="bubble" style="width:10vh;height:10vh;top:20%;right:8%;animation-delay:2s"></div>
    <div class="bubble" style="width:24vh;height:24vh;bottom:-6%;right:-10%;animation-delay:4s"></div>
    <div class="ground"></div>
    <div class="winds" id="winds"></div>

    <div class="shadow"></div>

    <!-- كوب بتصميم الهوية -->
    <div class="cupwrap">
      <svg viewBox="0 0 200 270">
        <defs>
          <linearGradient id="body" x1="0" x2="1">
            <stop offset="0" stop-color="#e6ddd0"/>
            <stop offset=".25" stop-color="#fbf7f1"/>
            <stop offset=".6" stop-color="#f3ece2"/>
            <stop offset="1" stop-color="#d9cebf"/>
          </linearGradient>
          <linearGradient id="rim" x1="0" x2="1">
            <stop offset="0" stop-color="#6e0404"/>
            <stop offset=".3" stop-color="#b01414"/>
            <stop offset="1" stop-color="#6e0404"/>
          </linearGradient>
        </defs>
        <path d="M36 30 L164 30 L148 255 Q100 263 52 255 Z" fill="url(#body)"/>
        <ellipse cx="100" cy="255" rx="48" ry="6" fill="#cfc3b2"/>
        <rect x="26" y="12" width="148" height="22" rx="11" fill="url(#rim)"/>
        <ellipse cx="100" cy="14" rx="70" ry="5" fill="#5c0000" opacity=".6"/>
      </svg>
      <img class="cuplogo" src="logo.png" alt="">
    </div>

    <div class="impact" id="impact">
      <div class="puddle"></div>
      <svg class="cracks" viewBox="0 0 400 100">
        <path d="M200 20 L150 40 L110 35 L60 55"/>
        <path d="M200 20 L250 45 L300 38 L350 60"/>
        <path d="M200 20 L190 60 L170 90"/>
        <path d="M200 20 L215 65 L240 95"/>
      </svg>
      <div class="wave"></div>
      <div class="wave w2"></div>
    </div>

    <div class="halo" style="--d:5.5s"></div>
    <div class="halo" style="--d:6.2s"></div>
    <img class="logo hero" src="logo.png" alt="">

    <div class="cs">
      <div class="letters" data-text="COMING"></div>
      <div class="letters" data-text="SOON"></div>
      <div class="line"></div>
    </div>
  </div>
  <div class="flash"></div>
</div>

<script>
  const winds=document.getElementById('winds');
  for(let k=0;k<10;k++){
    const w=document.createElement('div'); w.className='w';
    w.style.top=(10+Math.random()*60)+'vh';
    w.style.animationDelay=(Math.random()*1.1)+'s';
    winds.appendChild(w);
  }

  const impact=document.getElementById('impact');
  for(let k=0;k<18;k++){
    const d=document.createElement('div'); d.className='drop';
    const s=(0.8+Math.random()*1.6)+'vh';
    d.style.width=s; d.style.height=s;
    d.style.background=k%3?'#6b3e26':'#fff';
    const ang=Math.PI+Math.random()*Math.PI;
    const dist=8+Math.random()*16;
    d.style.setProperty('--x',(Math.cos(ang)*dist)+'vh');
    d.style.setProperty('--y',(Math.sin(ang)*dist)+'vh');
    impact.appendChild(d);
  }

  let idx=0;
  document.querySelectorAll('.letters').forEach(el=>{
    [...el.dataset.text].forEach(ch=>{
      const s=document.createElement('span');
      s.textContent=ch; s.style.setProperty('--i',idx++);
      el.appendChild(s);
    });
  });

  // بديل نصي إذا لم توجد صورة اللوغو
  const test=new Image();
  test.onerror=()=>{
    document.querySelectorAll('img.logo').forEach(im=>{
      const d=document.createElement('div');
      d.className=im.className+' txt'; d.textContent='siplab';
      im.replaceWith(d);
    });
    document.querySelectorAll('img.cuplogo').forEach(im=>{
      const d=document.createElement('div');
      d.className='cuplogo txt2'; d.textContent='siplab';
      im.replaceWith(d);
    });
  };
  test.src='logo.png';

  const frame=document.getElementById('frame');
  const TOTAL=11000;
  let timer;
  function play(){
    frame.classList.remove('play'); void frame.offsetWidth;
    frame.classList.add('play');
    clearTimeout(timer);
    timer=setTimeout(play,TOTAL);
  }
  play();

  // ===== تسجيل الفيديو وحفظه =====
  const btn=document.getElementById('rec');
  const status=document.getElementById('status');
  btn.onclick=async()=>{
    try{
      const stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:false,preferCurrentTab:true});
      const track=stream.getVideoTracks()[0];
      if(window.CropTarget && track.cropTo){
        await track.cropTo(await CropTarget.fromElement(frame));
      }
      btn.style.display='none';
      status.textContent='⏳ جاري التسجيل...';

      const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
      const type=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
      const rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:8000000});
      const chunks=[];
      rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      rec.onstop=()=>{
        stream.getTracks().forEach(t=>t.stop());
        const ext=type.includes('mp4')?'mp4':'webm';
        const a=document.createElement('a');
        a.href=URL.createObjectURL(new Blob(chunks,{type:type||'video/webm'}));
        a.download='siplab-coming-soon.'+ext;
        a.click();
        status.textContent='✅ تم حفظ الفيديو ('+ext.toUpperCase()+')';
        btn.style.display='';
      };

      await new Promise(r=>setTimeout(r,600));
      play();
      rec.start();
      setTimeout(()=>rec.stop(),TOTAL-200);
    }catch(e){
      status.textContent='';
      btn.style.display='';
      alert('لم يتم التسجيل، تأكد من اختيار "علامة التبويب هذه" والضغط على مشاركة.');
    }
  };
</script>
</body>
</html>
