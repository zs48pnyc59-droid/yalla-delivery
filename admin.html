<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة الإدارة - ALAA SALON</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--a:#d9a38f;--b:#14101a;--p:#1f1927;--t:#f1e9ee}
*{box-sizing:border-box}.hide{display:none!important}
body{margin:0;background:var(--b);color:var(--t);font-family:Cairo,sans-serif;padding:20px}
main{max-width:500px;margin:0 auto}
.bx{background:var(--p);border:1px solid #fff1;border-radius:16px;padding:16px;margin-bottom:12px}
input{width:100%;padding:11px;border-radius:11px;border:1px solid #fff2;background:#0004;color:var(--t);margin-top:8px}
button{font:700 14px Cairo;border:0;border-radius:10px;padding:10px 14px;background:var(--a);color:#1a1214;cursor:pointer;width:100%;margin-top:10px}
</style>
</head>
<body>
<main>
<section id="loginSec" class="bx">
 <h2>تسجيل دخول المشرفة</h2>
 <p style="font-size:12px;opacity:0.7">كلمة المرور الافتراضية هي: <b>12345</b></p>
 <input id="adminPass" type="password" placeholder="كلمة المرور">
 <button id="adminLogin">دخول</button>
</section>

<section id="controlSec" class="bx hide">
 <h2>لوحة التحكم</h2>
 <p>أدخل اسم العميل لإضافة ختم له:</p>
 <input id="clientName" placeholder="اسم العميل">
 <button id="addStampBtn">إضافة ختم (+1)</button>
 <button id="adminLogout" style="background:#444;color:#fff;margin-top:20px">تسجيل خروج</button>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
$("adminLogin").onclick = () => {
  if($("adminPass").value === "12345"){
    $("loginSec").classList.add("hide");
    $("controlSec").classList.remove("hide");
  } else {
    alert("كلمة المرور خطأ (جرب 12345)");
  }
};
$("adminLogout").onclick = () => {
  $("controlSec").classList.add("hide");
  $("loginSec").classList.remove("hide");
  $("adminPass").value = "";
};
$("addStampBtn").onclick = () => {
  const name = $("clientName").value.trim();
  if(!name) return alert("اكتب اسم العميل");
  let current = +(localStorage.getItem("stamps_" + name) || 0);
  if(current >= 5) current = 0; // تصفير عند الاكتمال
  localStorage.setItem("stamps_" + name, current + 1);
  alert("تمت إضافة ختم للعميل: " + name + " (المجموع: " + (current + 1) + ")");
  $("clientName").value = "";
};
</script>
</body>
</html>
